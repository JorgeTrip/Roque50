<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo degrade tema Roque 50 -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3c2c73" />
      <stop offset="100%" stop-color="#160e22" />
    </radialGradient>
    
    <!-- Degradé cuerpo del sobre -->
    <linearGradient id="envelopeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFE8F5" />
    </linearGradient>

    <!-- Degradé solapa del sobre -->
    <linearGradient id="envelopeFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F4FC" />
      <stop offset="100%" stop-color="#E4D9EE" />
    </linearGradient>

    <!-- Degradé sello de cera dorado -->
    <radialGradient id="sealGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF7E6" />
      <stop offset="45%" stop-color="#E0B86C" />
      <stop offset="100%" stop-color="#8F6224" />
    </radialGradient>

    <!-- Sombras -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fondo redondeado elegante estilo App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Grupo del Sobre -->
  <g filter="url(#shadow)" transform="translate(64, 116)">
    <!-- Cuerpo Base (384 x 280) -->
    <rect x="0" y="0" width="384" height="280" rx="24" fill="url(#envelopeBody)" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" />
    
    <!-- Líneas de pliegue interiores -->
    <path d="M 0 280 L 140 150 M 384 280 L 244 150" stroke="#C8B5DC" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
    
    <!-- Solapa triangular del sobre -->
    <path d="M 0 0 L 384 0 L 192 155 Z" fill="url(#envelopeFlap)" stroke="#D0BFDE" stroke-width="2" />
    
    <!-- Sello Dorado ("50") -->
    <g filter="url(#sealShadow)">
      <circle cx="192" cy="155" r="48" fill="url(#sealGrad)" stroke="#6E4A1A" stroke-width="2.5" />
      <circle cx="192" cy="155" r="41" fill="none" stroke="#FFF7E6" stroke-width="1.5" opacity="0.6" />
      <text x="192" y="167" font-family="'Space Grotesk', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#180F29" text-anchor="middle">50</text>
    </g>
  </g>
</svg>
